name: CI

on:
  push:
    branches: [main]
  pull_requests:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg2:1234@localhost:5432/football_test
      TEST_DATABASE_URL: postgresql+psycopg2:1234@localhost:5432/football_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: ci-test-secret-key
      ALGORITHM: HS256
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip installl --no-cache-dir -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t football-api:ci .
        
      - name: Smoke test container starts
        run: |
          docker run -d --name smoke-test -p 8000:8000 \
            -e DATABASE_URL="postgresql+psycopg2://postgres:1234@localhost:5432/football_test" \
            -e SECRET_KEY="ci-test-secret-key" \
            -e ALGORITHM="HS256" \
            -e REDIS_HOST="localhost" \
            -e REDIS_PORT=6379 \
            footballdb-api:ci
          sleep 5
          docker logs smoke-test
          docker stop smoke-test